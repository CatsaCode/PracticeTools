name: NDK build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*-bs-*.*.*'
    branches:
      - 'master'
      - 'main'
      - '*.*.*'
      - 'dev'
      - 'dev/*'
      - 'feat/*'
      - 'fix/*'
    paths-ignore:
      - '**.yml'
      - '!.github/workflows/build-ndk.yml'
      - '**.json'
      - '!qpm.json'
      - '!qpm.shared.json'
      - '!mod.template.json'
      - '**.txt'
      - '!CMakeLists.txt'
      - '**.ps1'
      - '!build.ps1'
      - '!createqmod.ps1'
      - '**.md'
      - '.gitignore'
  pull_request:
    branches:
        - 'master'
        - 'main'
        - '*.*.*'
        - 'dev'
        - 'dev/*'
        - 'feat/*'
        - 'fix/*'

env:
    module_id: "practicetools"
    qmod_name: "PracticeTools"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      name: Checkout
      with:
        submodules: true
        lfs: true

    - uses: seanmiddleditch/gha-setup-ninja@v5


    # get version from pushed tag
    - name: Extract version
      if: startsWith(github.ref, 'refs/tags/v')
      id: version
      run: |
        echo "TAG=${GITHUB_REF#refs/tags/}" >> ${GITHUB_OUTPUT}
        TEMP=$(echo "$GITHUB_REF_NAME" | grep -Po "(?<=v)\d+.\d+.\d+")
        echo "VERSION=$TEMP" >> ${GITHUB_OUTPUT}
        TEMP=$(echo "$GITHUB_REF_NAME" | grep -Po "(?<=bs-)[.\d_]*")
        echo "BS_VERSION=$TEMP" >> ${GITHUB_OUTPUT}

    - name: Setup qpm
      uses: Fernthedev/qpm-action@v1
      with:
        workflow_token: ${{ secrets.GITHUB_TOKEN }}
        resolve_ndk: true
        restore: true
        cache: true
        publish: false

    - name: QPM Edit Version
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        qpm package edit --version "${{ steps.version.outputs.VERSION }}"

    - name: Build & Create Qmod
      run: |
        cd ${GITHUB_WORKSPACE}
        qpm s qmod

    - name: Get Library Name
      id: libname
      run: |
        cd ./build/
        pattern="lib${module_id}*.so"
        files=( $pattern )
        echo "NAME=${files[0]}" >> ${GITHUB_OUTPUT}
        echo "BUILD_ID=$(readelf -n ${files[0]} | grep -Po "(?<=Build ID: )[0-9a-f]+")" >> ${GITHUB_OUTPUT}

    - name: Rename debug file
      run: mv "./build/debug/${{ steps.libname.outputs.NAME }}" "./build/debug_${{ steps.libname.outputs.NAME }}"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.libname.outputs.NAME }}
        path: ./build/${{ steps.libname.outputs.NAME }}
        if-no-files-found: error

    - name: Upload debug artifact
      uses: actions/upload-artifact@v4
      with:
        name: debug_${{ steps.libname.outputs.NAME }}
        path: ./build/debug_${{ steps.libname.outputs.NAME }}
        if-no-files-found: error

    - name: Upload qmod artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{env.qmod_name}}.qmod
        path: ./${{ env.qmod_name }}.qmod
        if-no-files-found: error

    - name: Calculate SHA-256 of the qmod file
      id: qmodsha
      run: |
        echo "QMOD_SHA=$(sha256sum ./${{ env.qmod_name }}.qmod | grep -Po "^[0-9a-f]+")" >> ${GITHUB_OUTPUT}

    # if we had a tag, we should make a release
    - name: Upload release artifacts
      if: startsWith(github.ref, 'refs/tags/v')
      id: upload_file_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.TAG }}
        draft: true
        generate_release_notes: true
        name: BetterHaptics v${{ steps.version.outputs.VERSION }} for ${{ steps.version.outputs.BS_VERSION }}
        body: |
          ### Build info

          SHA-256: ${{ steps.qmodsha.outputs.QMOD_SHA }}
          Build ID: ${{ steps.libname.outputs.BUILD_ID }}
        files: |
          ./build/${{ steps.libname.outputs.NAME }}
          ./build/debug_${{ steps.libname.outputs.NAME }}
          ./${{ env.qmod_name }}.qmod
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
